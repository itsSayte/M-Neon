<h1>Serveur Survie</h1>

{% if running %}
    <p>Statut : en ligne</p>

    <form method="post" action="/server/stop">
        <button type="submit">Arrêter</button>
    </form>
{% else %}
    <p>Statut : arrêté</p>

    <form method="post" action="/server/start">
        <button type="submit">Démarrer</button>
    </form>
{% endif %}
